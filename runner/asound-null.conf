# ALSA configuration that routes every PCM to a null sink.
#
# Used instead of disabling Wine's audio drivers. Disabling them
# (WINEDLLOVERRIDES=winealsa=d,...) makes DirectSound initialisation *fail*,
# and Soku responds with a modal "DSound-Error" dialog. Headless that dialog is
# never dismissed, so the game never renders a frame, wglSwapBuffers is never
# called, and the capture FSM sits in WAIT_TITLE forever.
#
# With this, winealsa loads and succeeds against a device that discards
# everything: DirectSound is happy, and nothing is audible.
pcm.!default {
    type null
}
ctl.!default {
    type hw
    card 0
}
