; =========================================================================
; SokuFrameExtractor Configuration
; =========================================================================
; Place this file next to SokuFrameExtractor.dll in the modules directory.
;
; Input Bitmask Format (stored per player per frame in the CSV):
;   Bit 0 (0x001): Up          Bit 5 (0x020): B (Weak Bullet)
;   Bit 1 (0x002): Down        Bit 6 (0x040): C (Strong Bullet)
;   Bit 2 (0x004): Left        Bit 7 (0x080): D (Dash)
;   Bit 3 (0x008): Right       Bit 8 (0x100): Change Card (A+B)
;   Bit 4 (0x010): A (Melee)   Bit 9 (0x200): Spell / Use Card (B+C)
;
; Directional combos use numpad notation (e.g. 9 = Up+Right = bits 0+3).
; =========================================================================

[General]

; Directory where extracted frames and input CSVs are saved.
; Each replay gets its own subdirectory:
;   <OutputDir>/<replay_name>/frames/000000.bmp
;   <OutputDir>/<replay_name>/inputs.csv
OutputDir = soku_extract

; Directory containing the .rep replay files to process.
; All .rep files in this directory will be processed in sorted order.
ReplayDir = replay

; Save frames as BMP (1) or raw BGRA (0).
; BMP is recommended: fast to write, universally readable, ~900KB each.
; Raw BGRA is slightly faster but requires custom tooling to view.
SaveAsBMP = 1

; Remove the 60fps frame limiter during extraction (1 = yes).
; This makes extraction run as fast as your CPU/GPU allow.
; The limiter is restored when navigating menus or when done.
FastForward = 1

; Skip the first N frames of each replay (0 = capture everything).
; Useful if the first few frames have loading artifacts.
SkipFrames = 0

; Enable verbose console output (0 = normal, 1 = debug).
Verbose = 0
EncoderThreads=4      ; Number of encoder threads (set to CPU core count)
UseRenderTarget=1     ; Use GetRenderTargetData (1) or GetFrontBufferData (0)