; =========================================================================
; SokuFrameExtractor Configuration
; =========================================================================
; Installed next to SokuFrameExtractor.dll as SokuFrameExtractor.ini.
; The runner rewrites this per job; edit it directly only for manual runs.
;
; Every key below is read by dll/src/main.cpp::loadConfig(), and every key that
; loadConfig() reads appears below. tests/test_config_parity.py fails the build
; if that stops being true -- the two had drifted badly before (this file used
; to advertise SaveAsBMP, EncoderThreads and UseRenderTarget, none of which any
; code has ever read).
;
; Input bitmask, per player per frame, as written to inputs.csv:
;   Bit 0 (0x001): Up          Bit 5 (0x020): B (weak bullet)
;   Bit 1 (0x002): Down        Bit 6 (0x040): C (strong bullet)
;   Bit 2 (0x004): Left        Bit 7 (0x080): D (dash)
;   Bit 3 (0x008): Right       Bit 8 (0x100): Change card (A+B)
;   Bit 4 (0x010): A (melee)   Bit 9 (0x200): Spell / use card (B+C)
; =========================================================================

[General]

; Directory holding the ONE .rep file to capture. The runner stages exactly one
; file here per launch; that is what makes the output attributable to a known
; input. More than one file is a staging bug and is logged as such.
ReplayDir = replay

; Where inputs.csv is written for this run.
OutputDir = soku_extract

; Video sink. Wine maps Z:\ to the Linux filesystem root, so this opens
; /tmp/sfe_video.fifo on the host. The runner creates the FIFO and attaches
; FFmpeg to it before launching the game; if the open fails the DLL falls back
; to writing raw BGRA into OutputDir/stream.bgra.
FifoPath = Z:\tmp\sfe_video.fifo

; Where the DLL writes its machine-readable result before exiting. The runner
; polls this to tell success from a crash or a hang.
StatusPath = Z:\tmp\sfe_status.json

; Remove the 60 fps limiter while capturing (1 = yes). Extraction then runs as
; fast as the host allows -- typically 2-4x real time under software rendering.
FastForward = 1

; Per-frame navigation and FSM logging. Noisy; off for production runs.
Verbose = 0
